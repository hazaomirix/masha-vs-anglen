<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>СЛОТЫ — CASINO RPO-326</title>
<meta name="description" content="Слот-автомат Lucky Reels. CASINO RPO-326 — премиальные демо-игры. 18+.">
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#D4AF37;--gold-light:#F0D060;--gold-dark:#B8960F;--gold-glow:rgba(212,175,55,0.3);--bg:#0A0A0F;--bg-card:rgba(16,16,28,0.7);--text:#F5F0E8;--text2:rgba(245,240,232,0.55);--glass-border:rgba(212,175,55,0.12);--radius:16px;--radius-sm:10px}
html{scroll-behavior:smooth}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:'Playfair Display',serif}

/* AMBIENT */
#ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ambient-glow{position:absolute;border-radius:50%;filter:blur(80px);opacity:.12}
.ambient-glow:nth-child(1){width:600px;height:600px;background:var(--gold);top:-200px;left:-150px}
.ambient-glow:nth-child(2){width:400px;height:400px;background:#8b5cf6;bottom:-100px;right:-80px}
.ambient-glow:nth-child(3){width:300px;height:300px;background:var(--gold-dark);top:40%;left:60%;opacity:.06}
.particle{position:absolute;border-radius:50%;background:var(--gold);pointer-events:none;opacity:.12;animation:particleDrift linear infinite}
@keyframes particleDrift{0%{transform:translateY(0)translateX(0)}100%{transform:translateY(-120vh)translateX(80px)}}

/* HEADER */
header{position:fixed;top:0;left:0;width:100%;z-index:1000;background:rgba(10,10,16,0.85);backdrop-filter:blur(32px);-webkit-backdrop-filter:blur(32px);border-bottom:1px solid var(--glass-border);padding:0 32px;height:72px;display:flex;align-items:center;justify-content:space-between}
.header-left{display:flex;align-items:center;gap:12px}
.header-left a{display:flex;align-items:center;gap:12px;color:inherit;text-decoration:none}
.header-left img{height:48px;width:auto;border-radius:6px}
.header-left span{font-family:'Playfair Display',serif;font-size:1.4rem;letter-spacing:6px;color:var(--gold);font-weight:700}
.back-link{color:var(--text2);font-size:.85rem;letter-spacing:2px;text-transform:uppercase;text-decoration:none;padding:6px 16px;border:1px solid var(--glass-border);border-radius:30px;transition:all .3s}
.back-link:hover{color:var(--gold);border-color:var(--gold)}
.header-right{display:flex;align-items:center;gap:14px}
.balance-badge{background:linear-gradient(135deg,#B8960F,#D4AF37,#F0D060);color:#0A0A0F;font-weight:800;padding:7px 20px;border-radius:30px;font-size:.88rem;box-shadow:0 0 30px rgba(212,175,55,0.15)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold-dark),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#000}
@media(max-width:600px){header{padding:0 16px;height:64px}.header-left img{height:40px}.header-left span{font-size:1.1rem;letter-spacing:4px}.back-link{font-size:.75rem;padding:4px 10px}}

/* MAIN */
main{flex:1;margin-top:72px;z-index:1;padding:40px 16px 60px;display:flex;flex-direction:column;align-items:center}
.slots-wrap{width:100%;max-width:780px;padding:0 8px}
.slots-header{text-align:center;margin-bottom:24px}
.slots-header h1{font-size:clamp(1.3rem,2.5vw,2rem);color:var(--gold);letter-spacing:4px;font-weight:700;text-shadow:0 0 30px rgba(212,175,55,0.1)}
.slots-header .divider{width:50px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:8px auto 0;border-radius:2px}

/* MACHINE BODY */
.slot-machine{position:relative;background:linear-gradient(150deg,#0e0e20 0%,#06060e 40%,#0d0d22 100%);border:2px solid rgba(212,175,55,0.3);border-radius:20px;padding:24px 20px 28px;box-shadow:0 30px 120px rgba(0,0,0,0.9),0 0 0 1px rgba(212,175,55,0.08);overflow:hidden}
.slot-machine::before{content:'';position:absolute;top:0;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.5}
.slot-machine::after{content:'';position:absolute;bottom:0;left:8%;right:8%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.3}
.slot-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.slot-head h3{font-size:1.3rem;color:var(--gold);letter-spacing:5px;font-weight:700;text-shadow:0 0 30px rgba(212,175,55,0.15)}
.slot-rtp{font-size:.7rem;color:var(--text2);letter-spacing:2px;padding:3px 12px;border:1px solid rgba(212,175,55,0.15);border-radius:20px}
.slot-rivets{display:flex;justify-content:space-between;padding:0 8px;margin-bottom:6px}
.slot-rivet{width:6px;height:6px;border-radius:50%;background:var(--gold);opacity:.25;box-shadow:0 0 6px rgba(212,175,55,0.3)}
.reel-strip{position:relative;background:linear-gradient(180deg,#05050a,#0a0a16 50%,#05050a);border:1px solid rgba(212,175,55,0.12);border-radius:14px;padding:16px 10px;box-shadow:inset 0 0 60px rgba(0,0,0,0.9)}
.reels{display:flex;justify-content:center;gap:6px}
.reel{width:145px;height:190px;background:linear-gradient(180deg,#080810,#0c0c1a 50%,#080810);border:1px solid rgba(212,175,55,0.06);border-radius:12px;overflow:hidden;position:relative;box-shadow:inset 0 0 30px rgba(0,0,0,0.9)}
.reel-window{position:relative;width:100%;height:100%;overflow:hidden}
.reel-strip-inner{position:absolute;left:0;width:100%;will-change:transform}
.reel-sym{height:190px;display:flex;align-items:center;justify-content:center;font-size:3.8rem;font-weight:700}
.reel-shade{position:absolute;inset:0;background:linear-gradient(180deg,rgba(0,0,0,0.6) 0%,transparent 22%,transparent 78%,rgba(0,0,0,0.6) 100%);border-radius:12px;pointer-events:none;z-index:5}
.payline{position:absolute;top:50%;left:1%;right:1%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);transform:translateY(-50%);z-index:4;opacity:.2;box-shadow:0 0 12px var(--gold)}
.reel-neon{position:absolute;top:0;width:2px;height:100%;z-index:3;transition:opacity .3s}
.reel-neon-l{left:-1px;background:linear-gradient(180deg,transparent,var(--gold),transparent);opacity:0}
.reel-neon-r{right:-1px;background:linear-gradient(180deg,transparent,var(--gold),transparent);opacity:0}
.reel.win .reel-neon-l,.reel.win .reel-neon-r{opacity:1;animation:neonPulse .4s ease-in-out infinite}
@keyframes neonPulse{0%,100%{opacity:.8}50%{opacity:.2}}
.reel.win{border-color:rgba(212,175,55,0.5);animation:winBorder .5s ease-in-out infinite}
@keyframes winBorder{0%,100%{border-color:rgba(212,175,55,0.5);box-shadow:0 0 40px rgba(212,175,55,0.15),inset 0 0 40px rgba(212,175,55,0.05)}50%{border-color:rgba(212,175,55,0.8);box-shadow:0 0 80px rgba(212,175,55,0.3),inset 0 0 60px rgba(212,175,55,0.1)}}
.reel.win .reel-sym{animation:symPop .3s ease-in-out infinite}
@keyframes symPop{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
.reel.spin .reel-sym{animation:symBlur .04s linear infinite}
@keyframes symBlur{0%{opacity:1;transform:translateY(0)}25%{opacity:.6;transform:translateY(-4px)}50%{opacity:1;transform:translateY(0)}75%{opacity:.6;transform:translateY(4px)}100%{opacity:1;transform:translateY(0)}}
.win-flash{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(212,175,55,0.12),transparent 70%);pointer-events:none;z-index:6;opacity:0;transition:opacity .3s;border-radius:12px}
.reel.win .win-flash{opacity:1;animation:flashPulse .5s ease-in-out infinite}
@keyframes flashPulse{0%,100%{opacity:.6}50%{opacity:1}}

/* CONTROLS */
.slot-ctrl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-top:18px}
.bet-field{background:rgba(255,255,255,0.03);border:1px solid rgba(212,175,55,0.2);border-radius:10px;color:var(--text);padding:8px 12px;width:130px;font-size:1rem;font-weight:700;text-align:center;outline:none;transition:border .3s}
.bet-field:focus{border-color:var(--gold)}
.bet-chip{background:rgba(212,175,55,0.05);color:var(--gold);border:1px solid rgba(212,175,55,0.15);border-radius:30px;padding:6px 16px;cursor:pointer;font-weight:600;font-size:.78rem;transition:all .3s;letter-spacing:1px}
.bet-chip:hover{background:rgba(212,175,55,0.12);transform:translateY(-1px)}
.bet-chip.allin{background:linear-gradient(135deg,var(--gold-dark),var(--gold));color:#000;border:none;font-weight:700}
.spin-wrap{text-align:center;margin-top:20px}
.spin-btn{display:inline-block;padding:14px 0;width:210px;background:linear-gradient(135deg,#a08020,#D4AF37 40%,#F0D060 60%,#D4AF37 80%,#a08020);background-size:200% 200%;color:#0A0A0F;font-weight:900;font-size:1.2rem;letter-spacing:6px;border:none;border-radius:50px;cursor:pointer;text-transform:uppercase;box-shadow:0 8px 40px rgba(212,175,55,0.3),inset 0 1px 0 rgba(255,255,255,0.3);transition:all .3s;animation:spinBtnShimmer 3s ease-in-out infinite}
@keyframes spinBtnShimmer{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.spin-btn:hover{transform:scale(1.04);box-shadow:0 12px 60px rgba(212,175,55,0.5)}
.spin-btn:active{transform:scale(.95)}
.spin-btn:disabled{opacity:.35;cursor:not-allowed;transform:none;animation:none}
.slot-result{text-align:center;font-size:1.2rem;font-weight:800;margin-top:14px;min-height:44px;letter-spacing:1px}
.slot-result.win{color:var(--gold);text-shadow:0 0 40px rgba(212,175,55,0.5);animation:resultBounce .4s ease}
@keyframes resultBounce{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.slot-result.lose{color:rgba(255,255,255,0.4)}

/* CONFETTI */
.confetti-piece{position:fixed;width:8px;height:8px;z-index:2000;pointer-events:none;top:-10px;animation:confettiFall linear forwards}
@keyframes confettiFall{0%{transform:translateY(0)rotate(0);opacity:1}100%{transform:translateY(110vh)rotate(720deg);opacity:.7}}

@media(max-width:600px){
  .reel{width:100px;height:130px}.reel-sym{font-size:2.8rem;height:130px}
  .slot-machine{padding:16px 12px 20px}
}

/* FOOTER */
footer{text-align:center;padding:28px 20px;border-top:1px solid var(--glass-border);color:var(--text2);font-size:.82rem;position:relative;z-index:1}
footer strong{color:var(--gold);font-size:1rem;display:block;margin-bottom:4px;letter-spacing:2px}
</style>
</head>
<body>

<div id="ambient">
  <div class="ambient-glow"></div><div class="ambient-glow"></div><div class="ambient-glow"></div>
</div>

<header>
  <div class="header-left">
    <a href="index.html">
      <img src="logo.png" alt="CASINO" onerror="this.style.display='none'">
      <span>CASINO</span>
    </a>
  </div>
  <div class="header-right">
    <a href="index.html" class="back-link">← НА ГЛАВНУЮ</a>
    <div class="balance-badge" data-balance>¥ 100 000</div>
    <div class="avatar">M</div>
  </div>
</header>

<main>
  <div class="slots-wrap">
    <div class="slots-header">
      <h1>🎰 LUCKY REELS</h1>
      <div class="divider"></div>
    </div>
    <div class="slot-machine">
      <div class="slot-head">
        <h3>СЛОТЫ</h3>
        <div class="slot-rtp">RTP 96.5%</div>
      </div>
      <div class="slot-rivets"><span class="slot-rivet"></span><span class="slot-rivet"></span><span class="slot-rivet"></span><span class="slot-rivet"></span><span class="slot-rivet"></span></div>
      <div class="reel-strip">
        <div class="reels" id="slotReels">
          <div class="reel" id="sr0">
            <div class="reel-window"><div class="reel-strip-inner" id="rsi0"></div></div>
            <div class="reel-shade"></div>
            <div class="reel-neon reel-neon-l"></div><div class="reel-neon reel-neon-r"></div>
            <div class="win-flash"></div>
          </div>
          <div class="reel" id="sr1">
            <div class="reel-window"><div class="reel-strip-inner" id="rsi1"></div></div>
            <div class="reel-shade"></div>
            <div class="reel-neon reel-neon-l"></div><div class="reel-neon reel-neon-r"></div>
            <div class="win-flash"></div>
          </div>
          <div class="reel" id="sr2">
            <div class="reel-window"><div class="reel-strip-inner" id="rsi2"></div></div>
            <div class="reel-shade"></div>
            <div class="reel-neon reel-neon-l"></div><div class="reel-neon reel-neon-r"></div>
            <div class="win-flash"></div>
          </div>
        </div>
        <div class="payline"></div>
      </div>
      <div class="slot-rivets" style="margin-top:6px"><span class="slot-rivet"></span><span class="slot-rivet"></span><span class="slot-rivet"></span><span class="slot-rivet"></span><span class="slot-rivet"></span></div>
      <div class="slot-ctrl">
        <input type="number" class="bet-field" id="slotBet" value="1000" min="10" step="100">
        <span class="bet-chip" onclick="setSB(100)">100</span>
        <span class="bet-chip" onclick="setSB(1000)">1K</span>
        <span class="bet-chip" onclick="setSB(5000)">5K</span>
        <span class="bet-chip allin" onclick="setSB(getBalance())">ALL IN</span>
      </div>
      <div class="spin-wrap">
        <button class="spin-btn" id="spinBtn" onclick="spin()">▶ SPIN</button>
      </div>
      <div class="slot-result" id="slotResult"></div>
    </div>
  </div>
</main>

<footer>
  <strong>18+ · Демо-сайт · Игра на виртуальные фишки</strong>
  <p>© 2026 CASINO RPO-326</p>
</footer>

<script>
// ===== PARTICLES =====
(function(){
  const a=document.getElementById('ambient');
  for(let i=0;i<30;i++){
    const p=document.createElement('div');
    p.className='particle';
    const s=1+Math.random()*3;
    p.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(Math.random()*100)+'%;bottom:-20px;animation-duration:'+(15+Math.random()*25)+'s;animation-delay:'+(Math.random()*10)+'s';
    a.appendChild(p);
  }
})();

// ===== BALANCE (shared with index.html) =====
const BAL_KEY='casinoRpoBal';
function getBalance(){return parseInt(localStorage.getItem(BAL_KEY)||'100000')}
function setBalance(v){localStorage.setItem(BAL_KEY,v);document.querySelectorAll('[data-balance]').forEach(e=>e.textContent='¥ '+Math.floor(v).toLocaleString('ru-RU'))}
function addBalance(v){setBalance(getBalance()+v)}
setBalance(getBalance());

// ===== AUDIO =====
let actx=null;
function getA(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();return actx}
function play(freq,dur,type,vol){
  try{
    const c=getA(),o=c.createOscillator(),g=c.createGain();
    o.type=type||'square';o.frequency.value=freq;g.gain.setValueAtTime(vol||.07,c.currentTime);
    g.gain.exponentialRampToValueAtTime(.001,c.currentTime+dur);
    o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+dur);
  }catch(e){}
}
function sndSpin(){play(200,.25,'sawtooth',.04);setTimeout(()=>play(160,.25,'sawtooth',.04),100)}
function sndWin(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>play(f,.15,'sine',.07),i*130))}
function sndLose(){play(170,.4,'sawtooth',.06)}

// ===== CONFETTI =====
function confetti(count){
  const cols=['#D4AF37','#F0D060','#fff','#e33','#4af','#c22'];
  for(let i=0;i<count;i++){
    const p=document.createElement('div');
    p.className='confetti-piece';
    const s=5+Math.random()*8;
    p.style.cssText='left:'+(Math.random()*100)+'vw;width:'+s+'px;height:'+s+'px;background:'+cols[Math.floor(Math.random()*cols.length)]+';border-radius:'+(Math.random()<.5?'50%':'2px')+';animation-duration:'+(1.8+Math.random()*2.2)+'s;animation-delay:'+(Math.random()*.4)+'s';
    document.body.appendChild(p);
    setTimeout(()=>p.remove(),4500);
  }
}

// ===== SLOTS ENGINE =====
const SYM=['7️⃣','💎','🍒','🍊','🍋','🔔'];
const SYM_COL={'7️⃣':'#e33','💎':'#4af','🍒':'#c22','🍊':'#f82','🍋':'#cf0','🔔':'#da3'};
let busy=false;
function setSB(v){document.getElementById('slotBet').value=v}
function buildStrips(){
  ['rsi0','rsi1','rsi2'].forEach(id=>{
    const el=document.getElementById(id);const s=[];
    for(let i=0;i<30;i++)s.push(SYM[Math.floor(Math.random()*SYM.length)]);
    s.push(SYM[Math.floor(Math.random()*SYM.length)]);
    s.push(SYM[Math.floor(Math.random()*SYM.length)]);
    s.push(SYM[Math.floor(Math.random()*SYM.length)]);
    el.innerHTML=s.map(sym=>'<div class="reel-sym" style="color:'+SYM_COL[sym]+';text-shadow:0 0 20px '+SYM_COL[sym]+'40">'+sym+'</div>').join('');
    el.style.top='0';
  });
}
buildStrips();
function spin(){
  if(busy)return;
  const bet=parseInt(document.getElementById('slotBet').value)||0;
  const res=document.getElementById('slotResult');
  if(bet<10||bet>getBalance()){res.textContent=bet>getBalance()?'Недостаточно фишек':'Минимум 10';res.className='slot-result lose';return}
  busy=true;res.className='slot-result';res.textContent='';
  const btn=document.getElementById('spinBtn');btn.disabled=true;
  addBalance(-bet);sndSpin();
  const reels=[0,1,2].map(i=>document.getElementById('sr'+i));
  reels.forEach(r=>{r.classList.add('spin');r.classList.remove('win')});
  const finalSyms=[];
  reels.forEach((r,i)=>{
    const strip=document.getElementById('rsi'+i);
    const sh=190;const total=strip.children.length;
    const dur=1400+i*400;const start=Date.now();
    const iv=setInterval(()=>{
      if(Date.now()-start>dur-200){
        clearInterval(iv);
        const tgt=Math.floor(Math.random()*SYM.length);const sym=SYM[tgt];finalSyms[i]=sym;
        let pos=-1;for(let c=total-1;c>=0;c--)if(strip.children[c].textContent===sym){pos=c;break}
        if(pos<0)pos=total-3;
        strip.style.transition='top .3s cubic-bezier(.2,.9,.3,1)';
        strip.style.top=-(pos*sh)+'px';
        r.classList.remove('spin');
        if(i===2)setTimeout(()=>finishSpin(finalSyms,bet),400);
      }else{
        strip.style.transition='none';
        strip.style.top=-(Math.floor(Math.random()*total)*sh)+'px';
      }
    },60);
  });
}
function finishSpin(out,bet){
  const res=document.getElementById('slotResult');
  const rl=[0,1,2].map(i=>document.getElementById('sr'+i));
  let win=0,msg='';
  const t=out[0]===out[1]&&out[1]===out[2];
  const p=out[0]===out[1]||out[1]===out[2]||out[0]===out[2];
  if(t){win=(out[0]==='💎'||out[0]==='🍒')?bet*10:bet*5;msg=(out[0]==='💎'||out[0]==='🍒')?'ДЖЕКПОТ! ×10':'ТРИ! ×5'}
  else if(p){win=bet*2;msg='ПАРА! ×2'}
  if(win>0){addBalance(win);res.textContent=msg+'  +¥'+win.toLocaleString('ru-RU');res.className='slot-result win';rl.forEach(r=>r.classList.add('win'));sndWin();confetti(70);setTimeout(()=>rl.forEach(r=>r.classList.remove('win')),3000)}
  else{res.textContent='Не повезло';res.className='slot-result lose';sndLose()}
  document.getElementById('spinBtn').disabled=false;busy=false;
  buildStrips();
}
document.getElementById('slotBet').addEventListener('keydown',e=>{if(e.key==='Enter')spin()});
</script>
</body>
</html>
