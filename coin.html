<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ОРЁЛ/РЕШКА — CASINO RPO-326</title>
<link rel="icon" type="image/png" href="logo.png">
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{--gold:#D4AF37;--gold-light:#F0D060;--gold-dark:#B8960F;--bg:#0A0A0F;--text:#F5F0E8;--text2:rgba(245,240,232,0.55);--glass-border:rgba(212,175,55,0.12);--radius:16px}
body{font-family:Inter,sans-serif;background:var(--bg);color:var(--text);overflow-x:hidden;min-height:100vh;display:flex;flex-direction:column}
h1,h2,h3{font-family:'Playfair Display',serif}
#ambient{position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden}
.ambient-glow{position:absolute;border-radius:50%;filter:blur(80px);opacity:.12}
.ambient-glow:nth-child(1){width:600px;height:600px;background:var(--gold);top:-200px;left:-150px}
.ambient-glow:nth-child(2){width:400px;height:400px;background:#8b5cf6;bottom:-100px;right:-80px}
.ambient-glow:nth-child(3){width:300px;height:300px;background:var(--gold-dark);top:40%;left:60%;opacity:.06}
.particle{position:absolute;border-radius:50%;background:var(--gold);pointer-events:none;opacity:.1;animation:particleDrift linear infinite}
@keyframes particleDrift{0%{transform:translateY(0)}100%{transform:translateY(-120vh)translateX(80px)}}
header{position:fixed;top:0;left:0;width:100%;z-index:1000;background:rgba(10,10,16,0.85);backdrop-filter:blur(32px);border-bottom:1px solid var(--glass-border);padding:0 32px;height:72px;display:flex;align-items:center;justify-content:space-between}
.header-left a{display:flex;align-items:center;gap:12px;text-decoration:none;color:inherit}
.header-left img{height:48px;border-radius:6px}
.header-left span{font-family:'Playfair Display',serif;font-size:1.4rem;letter-spacing:6px;color:var(--gold);font-weight:700}
.back-link{color:var(--text2);font-size:.85rem;letter-spacing:2px;text-decoration:none;padding:6px 16px;border:1px solid var(--glass-border);border-radius:30px;transition:all .3s}
.back-link:hover{color:var(--gold);border-color:var(--gold)}
.header-right{display:flex;align-items:center;gap:14px}
.balance-badge{background:linear-gradient(135deg,#B8960F,#D4AF37,#F0D060);color:#0A0A0F;font-weight:800;padding:7px 20px;border-radius:30px;font-size:.88rem}
.sound-toggle{width:36px;height:36px;border-radius:50%;background:rgba(255,255,255,0.05);border:1px solid var(--glass-border);color:var(--text2);display:flex;align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem;transition:all .3s}
.sound-toggle:hover{border-color:var(--gold);color:var(--gold)}
.avatar{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--gold-dark),var(--gold));display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem;color:#000}
.topup-btn{background:rgba(212,175,55,0.08);color:var(--gold);border:1px solid rgba(212,175,55,0.3);border-radius:30px;padding:7px 16px;font-size:.8rem;font-weight:700;letter-spacing:1px;cursor:pointer;transition:all .3s}
.topup-btn:hover{background:linear-gradient(135deg,var(--gold-dark),var(--gold));color:#000;box-shadow:0 4px 20px rgba(212,175,55,0.3);transform:translateY(-1px)}
@media(max-width:600px){header{padding:0 16px;height:64px}.header-left img{height:40px}.header-left span{font-size:1.1rem}.back-link{font-size:.75rem;padding:4px 10px}}
main{flex:1;margin-top:72px;z-index:1;padding:40px 16px 60px;display:flex;flex-direction:column;align-items:center}
.wrap{width:100%;max-width:780px}
.hdr{text-align:center;margin-bottom:20px}
.hdr h1{font-size:clamp(1.3rem,2.5vw,2rem);color:var(--gold);letter-spacing:4px}
.hdr .d{width:50px;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);margin:8px auto 0}
.panel{background:linear-gradient(150deg,#0e0e20,#06060e 50%,#0d0d22);border:2px solid rgba(212,175,55,0.2);border-radius:var(--radius);padding:26px 20px 28px;box-shadow:0 30px 100px rgba(0,0,0,0.7);position:relative;overflow:hidden}
.panel::before{content:'';position:absolute;top:0;left:10%;right:10%;height:2px;background:linear-gradient(90deg,transparent,var(--gold),transparent);opacity:.4}
.panel h3{font-size:1.15rem;color:var(--gold);letter-spacing:4px;text-align:center;margin-bottom:4px}
.panel .hint{text-align:center;color:var(--text2);font-size:.78rem;letter-spacing:2px;text-transform:uppercase;margin-bottom:14px}
.bet-r{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:center;margin-bottom:14px}
.bet-f{background:rgba(255,255,255,0.03);border:1px solid rgba(212,175,55,0.2);border-radius:10px;color:var(--text);padding:8px 12px;width:130px;font-size:1rem;font-weight:700;text-align:center;outline:none}
.bet-f:focus{border-color:var(--gold)}
.bet-c{background:rgba(212,175,55,0.05);color:var(--gold);border:1px solid rgba(212,175,55,0.15);border-radius:30px;padding:6px 16px;cursor:pointer;font-weight:600;font-size:.78rem;transition:all .3s}
.bet-c:hover{background:rgba(212,175,55,0.12);transform:translateY(-1px)}
.bet-c.ai{background:linear-gradient(135deg,var(--gold-dark),var(--gold));color:#000;border:none;font-weight:700}
.pick-r{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;margin-bottom:18px}
.pick-b{background:rgba(212,175,55,0.06);color:var(--text);border:1px solid rgba(212,175,55,0.25);border-radius:14px;padding:14px 34px;font-size:1rem;font-weight:600;letter-spacing:2px;cursor:pointer;transition:all .3s;display:flex;flex-direction:column;align-items:center;gap:6px}
.pick-b .pi{font-size:2.2rem}
.pick-b .pk{font-size:.65rem;color:var(--text2);letter-spacing:1px}
.pick-b:hover{border-color:var(--gold);color:var(--gold);transform:translateY(-2px)}
.pick-b.sel{background:linear-gradient(135deg,var(--gold-dark),var(--gold));color:#000;border-color:var(--gold);font-weight:800;box-shadow:0 8px 40px rgba(212,175,55,0.3)}
.pick-b.sel .pk,.pick-b.sel .pi{color:#000}
.coin-arena{display:flex;flex-direction:column;align-items:center;margin:6px 0}
.coin-display{width:150px;height:150px;border-radius:50%;background:radial-gradient(circle at 30% 30%,#FBE28C,#D4AF37 45%,#8a6d1f);display:flex;align-items:center;justify-content:center;font-size:4rem;box-shadow:0 8px 50px rgba(212,175,55,0.35),inset 0 -4px 15px rgba(0,0,0,0.3);position:relative;transition:transform .15s}
.coin-display::after{content:'';position:absolute;inset:6px;border-radius:50%;border:2px dashed rgba(0,0,0,0.2)}
.coin-display.spin{animation:coinShake .12s linear infinite}
@keyframes coinShake{0%{transform:translateY(0)scale(1)}25%{transform:translateY(-6px)scale(1.05)}50%{transform:translateY(0)scale(1)}75%{transform:translateY(-6px)scale(1.05)}100%{transform:translateY(0)scale(1)}}
.coin-display.land{animation:coinLand .35s ease}
@keyframes coinLand{0%{transform:scale(.7)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
.coin-display.win{box-shadow:0 0 80px rgba(212,175,55,0.5)}
.clbl{font-size:.85rem;color:var(--text2);letter-spacing:3px;margin-top:6px}
.go-w{text-align:center;margin-top:10px}
.go-b{display:inline-block;padding:14px 48px;background:linear-gradient(135deg,#a08020,#D4AF37 40%,#F0D060 60%,#D4AF37 80%,#a08020);background-size:200% 200%;color:#0A0A0F;font-weight:900;font-size:1.1rem;letter-spacing:5px;border:none;border-radius:50px;cursor:pointer;text-transform:uppercase;box-shadow:0 8px 40px rgba(212,175,55,0.3);transition:all .3s;animation:shim 3s ease-in-out infinite}
@keyframes shim{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.go-b:hover{transform:scale(1.04);box-shadow:0 12px 60px rgba(212,175,55,0.5)}
.go-b:active{transform:scale(.95)}
.go-b:disabled{opacity:.4;cursor:not-allowed;transform:none;animation:none}
.res{text-align:center;font-size:1.3rem;font-weight:800;margin-top:16px;min-height:52px}
.res.win{color:var(--gold);text-shadow:0 0 40px rgba(212,175,55,0.5);animation:rb .4s ease}
.res.lose{color:rgba(245,240,232,0.55)}
@keyframes rb{0%{transform:scale(.5);opacity:0}60%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
.sr{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:20px}
.sb{background:rgba(255,255,255,0.03);border:1px solid var(--glass-border);border-radius:12px;padding:12px 6px;text-align:center}
.sb .sn{font-family:'Playfair Display',serif;font-size:1.35rem;font-weight:700;color:var(--gold)}
.sb .sl{font-size:.62rem;color:var(--text2);text-transform:uppercase;letter-spacing:1px;margin-top:3px}
@media(max-width:520px){.sr{grid-template-columns:repeat(2,1fr)}}
.hist{margin-top:18px;text-align:center}
.hist-l{font-size:.7rem;color:var(--text2);text-transform:uppercase;letter-spacing:2px;margin-bottom:8px}
.hist-c{display:flex;justify-content:center;gap:6px;flex-wrap:wrap;min-height:28px}
.hc{width:26px;height:26px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:.8rem;font-weight:700;border:1px solid var(--glass-border);background:rgba(255,255,255,0.04)}
.hc.w{background:rgba(212,175,55,0.25);border-color:var(--gold);color:var(--gold)}
.hc.l{background:rgba(200,60,60,0.18);border-color:rgba(200,60,60,0.4);color:#e66}
.hist-empty{font-size:.8rem;color:var(--text2)}
.rst{display:inline-block;margin-top:8px;background:none;border:none;color:var(--text2);font-size:.72rem;letter-spacing:1px;cursor:pointer;text-transform:uppercase;transition:color .3s}
.rst:hover{color:var(--gold)}
.cf{position:fixed;width:8px;height:8px;z-index:2000;pointer-events:none;top:-10px;animation:cfl linear forwards}
@keyframes cfl{0%{transform:translateY(0)rotate(0);opacity:1}100%{transform:translateY(110vh)rotate(720deg);opacity:.7}}
footer{text-align:center;padding:28px 20px;border-top:1px solid var(--glass-border);color:var(--text2);font-size:.82rem;position:relative;z-index:1}
footer strong{color:var(--gold);font-size:1rem;display:block;margin-bottom:4px;letter-spacing:2px}
</style>
</head>
<body>
<div id="ambient"><div class="ambient-glow"></div><div class="ambient-glow"></div><div class="ambient-glow"></div></div>
<header>
  <div class="header-left"><a href="index.html"><img src="logo.png" alt="CASINO" onerror="this.style.display='none'"><span>CASINO</span></a></div>
  <div class="header-right">
    <a href="index.html" class="back-link">← НА ГЛАВНУЮ</a>
    <div class="balance-badge" data-balance>¥ 100 000</div>
    <button class="topup-btn" onclick="topup()">+100К</button>
    <div class="sound-toggle" id="soundToggle" onclick="ts()">🔊</div>
    <div class="avatar">M</div>
  </div>
</header>
<main>
  <div class="wrap">
    <div class="hdr"><h1>🪙 ОРЁЛ / РЕШКА</h1><div class="d"></div></div>
    <div class="panel">
      <h3>УГАДАЙ СТОРОНУ МОНЕТЫ</h3>
      <div class="hint">выплата ×2 · честные 50/50</div>
      <div class="bet-r">
        <input type="number" class="bet-f" id="cb" value="1000" min="10" step="100">
        <span class="bet-c" onclick="sCB(100)">100</span>
        <span class="bet-c" onclick="sCB(1000)">1K</span>
        <span class="bet-c" onclick="sCB(5000)">5K</span>
        <span class="bet-c ai" onclick="sCB(gB())">ALL IN</span>
      </div>
      <div class="pick-r">
        <button class="pick-b" id="cE" onclick="cP('eagle')"><span class="pi">🦅</span><span>ОРЁЛ</span><span class="pk">клавиша 1</span></button>
        <button class="pick-b" id="cT" onclick="cP('tails')"><span class="pi">🙂</span><span>РЕШКА</span><span class="pk">клавиша 2</span></button>
      </div>
      <div class="coin-arena">
        <div class="coin-display" id="coinEl">🦅</div>
        <div class="clbl" id="sideLbl">...</div>
      </div>
      <div class="go-w"><button class="go-b" id="coinBtn" onclick="fC()">▶ БРОСОК</button></div>
      <div class="res" id="coinRes"></div>
      <div class="sr">
        <div class="sb"><div class="sn" id="stG">0</div><div class="sl">Игр</div></div>
        <div class="sb"><div class="sn" id="stW">0</div><div class="sl">Побед</div></div>
        <div class="sb"><div class="sn" id="stS">0</div><div class="sl">Серия</div></div>
        <div class="sb"><div class="sn" id="stB">0</div><div class="sl">Рекорд</div></div>
      </div>
      <div class="hist">
        <div class="hist-l">История бросков</div>
        <div class="hist-c" id="histC"></div>
        <button class="rst" onclick="rS()">сбросить статистику</button>
      </div>
    </div>
  </div>
</main>
<footer><strong>18+ · Демо-сайт · Игра на виртуальные фишки</strong><p>© 2026 CASINO RPO-326</p></footer>
<script>
// PARTICLES
(function(){const a=document.getElementById('ambient');for(let i=0;i<25;i++){const p=document.createElement('div');p.className='particle';const s=1+Math.random()*3;p.style.cssText='width:'+s+'px;height:'+s+'px;left:'+(Math.random()*100)+'%;bottom:-20px;animation-duration:'+(15+Math.random()*25)+'s;animation-delay:'+(Math.random()*10)+'s';a.appendChild(p)}})();

// CONFIG
const SK='casinoSound',BK='casinoRpoBal',STK='coinStats';
let sd=localStorage.getItem(SK)!=='off';
let st=JSON.parse(localStorage.getItem(STK)||'null')||{g:0,w:0,s:0,b:0};
let hi=[];

// BALANCE
function gB(){return parseInt(localStorage.getItem(BK)||'100000')}
function sB(v){localStorage.setItem(BK,v);document.querySelectorAll('[data-balance]').forEach(e=>e.textContent='¥ '+Math.floor(v).toLocaleString('ru-RU'))}
function aB(v){sB(gB()+v)}sB(gB());
function topup(){sB(Math.max(gB(),100000));sw();cf(20)}

// AUDIO
let ax=null;
function gA(){if(!ax)ax=new(window.AudioContext||window.webkitAudioContext)();return ax}
function p(f,d,t,v){if(!sd)return;try{const c=gA(),o=c.createOscillator(),g=c.createGain();o.type=t;o.frequency.value=f;g.gain.setValueAtTime(v,c.currentTime);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+d);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+d)}catch(e){}}
function sc(){p(600,.06,'square',.04)}
function sw(){[523,659,784,1047].forEach((f,i)=>setTimeout(()=>p(f,.15,'sine',.07),i*130))}
function sl(){p(170,.4,'sawtooth',.06)}
function ts(){sd=!sd;localStorage.setItem(SK,sd?'on':'off');document.getElementById('soundToggle').textContent=sd?'🔊':'🔇'}
if(!sd)document.getElementById('soundToggle').textContent='🔇';

// CONFETTI
function cf(n){const c=['#D4AF37','#F0D060','#fff','#e33','#4af','#c22'];for(let i=0;i<n;i++){const p=document.createElement('div');p.className='cf';const s=5+Math.random()*8;p.style.cssText='left:'+(Math.random()*100)+'vw;width:'+s+'px;height:'+s+'px;background:'+c[Math.floor(Math.random()*c.length)]+';border-radius:'+(Math.random()<.5?'50%':'2px')+';animation-duration:'+(1.8+Math.random()*2.2)+'s;animation-delay:'+(Math.random()*.4)+'s';document.body.appendChild(p);setTimeout(()=>p.remove(),4500)}}

// STATS
function sv(){localStorage.setItem(STK,JSON.stringify(st))}
function rN(){document.getElementById('stG').textContent=st.g;document.getElementById('stW').textContent=st.w;document.getElementById('stS').textContent=st.s;document.getElementById('stB').textContent=st.b}
function rH(){const e=document.getElementById('histC');if(!hi.length){e.innerHTML='<span class="hist-empty">пока нет бросков</span>';return}e.innerHTML=hi.map(h=>'<span class="hc '+(h.w?'w':'l')+'">'+(h.s==='eagle'?'О':'Р')+'</span>').join('')}
function rS(){st={g:0,w:0,s:0,b:0};hi=[];sv();rN();rH();sc()}
rN();rH();

// GAME
let cp='',fl=false;
function sCB(v){document.getElementById('cb').value=v}
function cP(x){if(fl)return;cp=x;document.getElementById('cE').classList.toggle('sel',x==='eagle');document.getElementById('cT').classList.toggle('sel',x==='tails');sc()}

function fC(){
  if(fl)return;
  if(!cp){document.getElementById('coinRes').textContent='Выбери сторону (1 — орёл, 2 — решка)';document.getElementById('coinRes').className='res lose';sl();return}
  const bt=document.getElementById('coinBtn'),bet=parseInt(document.getElementById('cb').value)||0,res=document.getElementById('coinRes');
  if(bet<10||bet>gB()){res.textContent=bet>gB()?'Недостаточно фишек':'Минимум 10';res.className='res lose';sl();return}
  fl=true;bt.disabled=true;aB(-bet);sc();res.className='res';res.textContent='';
  const el=document.getElementById('coinEl'),side=Math.random()<.5?'eagle':'tails';
  el.classList.remove('spin','land','win');void el.offsetWidth;el.classList.add('spin');
  // rapid emoji swap during spin
  const frames=['🦅','🙂','🦅','🙂','🦅','🙂','🦅','🙂','🦅','🙂','🦅','🙂','🦅','🙂','🦅','🙂','🦅','🙂','🦅','🙂'];
  let fi=0;
  const iv=setInterval(()=>{el.textContent=frames[fi%frames.length];fi++},80);
  setTimeout(()=>{
    clearInterval(iv);
    el.classList.remove('spin');
    const stxt=side==='eagle'?'ОРЁЛ':'РЕШКА',icon=side==='eagle'?'🦅':'🙂';
    el.textContent=icon;
    void el.offsetWidth;el.classList.add('land');
    document.getElementById('sideLbl').textContent=stxt+'!';
    st.g++;const win=cp===side;
    if(win){st.w++;st.s++;if(st.s>st.b)st.b=st.s}else{st.s=0}
    hi.unshift({s:side,w:win});if(hi.length>12)hi.pop();sv();rN();rH();
    let msg='';
    if(win){const amt=bet*2;aB(amt);msg='ПОБЕДА! '+stxt+' — ×2 · +¥'+amt.toLocaleString('ru-RU');res.className='res win';el.classList.add('win');sw();cf(60)}
    else{msg='Мимо. Выпал: '+stxt;res.className='res lose';sl()}
    res.textContent=msg;
    setTimeout(()=>{bt.disabled=false;fl=false},300);
  },1600);
}
document.getElementById('cb').addEventListener('keydown',e=>{if(e.key==='Enter')fC()});
document.addEventListener('keydown',e=>{if(e.key==='1')cP('eagle');else if(e.key==='2')cP('tails');else if(e.key==='Enter')fC()});
</script>
</body>
</html>
